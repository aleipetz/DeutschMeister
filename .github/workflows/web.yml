name: Web app

on:
  push:
    branches: [master]
    paths: ['Web/**', 'Content/**', 'Tools/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['Web/**', 'Content/**', 'Tools/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate content
        run: python3 Tools/validate_content.py
      - name: Check the web build is committed
        run: python3 Tools/build_web.py --check
      - name: Unit tests
        run: node --test Web/tests/*.test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: rsync -a --exclude tests Web/ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
